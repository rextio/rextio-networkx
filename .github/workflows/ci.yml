name: CI

on:
  push:
    branches: [main, "0.1.1"]
  pull_request:
    branches: [main, "0.1.1"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rextio: ["0.1.3", "0.1.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the selected compatible core and this plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rextio==${{ matrix.rextio }}"
          python -m pip install -e ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests benchmarks
          mypy
      - name: Build distribution
        run: python -m build
      - name: Run cargo-free suite
        run: pytest -m "not needs_cargo"
      - name: Run real-Cargo traversal proof
        run: pytest tests/e2e/test_traversal_real_cargo.py
