name: CI

on:
  push:
    branches: [main, "0.1.1"]
  pull_request:
    branches: [main, "0.1.1"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rextio: ["0.1.3", "0.1.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the selected compatible core and this plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rextio==${{ matrix.rextio }}"
          python -m pip install -e ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests benchmarks
          mypy
      - name: Build distribution
        run: python -m build
      - name: Run cargo-free suite
        run: pytest -m "not needs_cargo"
      - name: Run real-Cargo components and traversal proofs
        run: pytest tests/e2e/test_components_real_cargo.py tests/e2e/test_traversal_real_cargo.py

  core-016-integration:
    name: Core 0.1.6 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rextio/rextio
          ref: "0.1.6"
          path: .core-rextio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the current Core integration branch and this plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .core-rextio
          python -m pip install -e ".[dev]"
          python -c "from rextio.plugins.api import PLUGIN_API_VERSION; assert PLUGIN_API_VERSION == '1.6', PLUGIN_API_VERSION"
      - name: Run focused plugin and claim tests
        run: >-
          pytest tests/test_plugin_contract.py tests/test_traversal.py
          tests/test_components.py tests/test_graph_queries.py tests/test_has_path.py
          tests/test_shortest_path_length.py tests/test_shortest_path_lengths.py
          tests/test_connectivity_scalars.py tests/test_type_support_codegen.py
      - name: Run real-Cargo components and traversal proofs
        run: pytest tests/e2e/test_components_real_cargo.py tests/e2e/test_traversal_real_cargo.py
